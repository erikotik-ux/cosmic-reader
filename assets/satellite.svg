<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sat-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6eefb"/>
      <stop offset="0.34" stop-color="#90cae0"/>
      <stop offset="0.66" stop-color="#4c9cba"/>
      <stop offset="1" stop-color="#2a7491"/>
    </linearGradient>
    <linearGradient id="sat-body2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2f4fc"/>
      <stop offset="0.4" stop-color="#a3d4e7"/>
      <stop offset="0.7" stop-color="#5aa6c2"/>
      <stop offset="1" stop-color="#367f9c"/>
    </linearGradient>
    <linearGradient id="sat-panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57acc8"/>
      <stop offset="1" stop-color="#2c7e9a"/>
    </linearGradient>
    <radialGradient id="sat-dish" cx="0.4" cy="0.34" r="0.82">
      <stop offset="0" stop-color="#d4ecf5"/>
      <stop offset="0.7" stop-color="#69aac1"/>
      <stop offset="1" stop-color="#2e6c83"/>
    </radialGradient>
  </defs>

  <g transform="rotate(50 100 100)">

    <!-- ══ SOLAR WINGS — drawn through the body mid, at a shallow angle ══ -->
    <g transform="rotate(-28 100 88)">
      <!-- struts -->
      <line x1="72" y1="88" x2="86" y2="88" stroke="#2f83a2" stroke-width="2"/>
      <line x1="114" y1="88" x2="128" y2="88" stroke="#2f83a2" stroke-width="2"/>
      <!-- LEFT wing -->
      <polygon points="72,74 24,70 24,98 72,102" fill="url(#sat-panel)" stroke="#1c5e76" stroke-width="1"/>
      <g stroke="rgba(18,55,70,0.55)" stroke-width="0.8">
        <line x1="56" y1="72.7" x2="56" y2="100.7"/>
        <line x1="40" y1="71.3" x2="40" y2="99.3"/>
        <line x1="72" y1="88" x2="24" y2="84"/>
      </g>
      <!-- RIGHT wing -->
      <polygon points="128,74 176,70 176,98 128,102" fill="url(#sat-panel)" stroke="#1c5e76" stroke-width="1"/>
      <g stroke="rgba(18,55,70,0.55)" stroke-width="0.8">
        <line x1="144" y1="72.7" x2="144" y2="100.7"/>
        <line x1="160" y1="71.3" x2="160" y2="99.3"/>
        <line x1="128" y1="88" x2="176" y2="84"/>
      </g>
    </g>

    <!-- ══ BODY — vertical cylinder; bottom = front (dish), top = back (dome) ══ -->
    <!-- dish -->
    <line x1="100" y1="139" x2="100" y2="149" stroke="#3f8aa3" stroke-width="2"/>
    <ellipse cx="100" cy="156" rx="14" ry="5.5" fill="url(#sat-dish)" stroke="#2e6c83" stroke-width="1"/>
    <ellipse cx="100" cy="155" rx="8.5" ry="3.2" fill="rgba(22,62,78,0.4)"/>
    <line x1="93" y1="151" x2="100" y2="147" stroke="#3f8aa3" stroke-width="0.9"/>
    <line x1="107" y1="151" x2="100" y2="147" stroke="#3f8aa3" stroke-width="0.9"/>
    <circle cx="100" cy="146.5" r="1.4" fill="#d4ecf5"/>

    <!-- aperture / instrument ring -->
    <rect x="91" y="130" width="18" height="9" fill="#154a5f"/>
    <ellipse cx="100" cy="130" rx="9" ry="2.7" fill="#1f6a86"/>
    <ellipse cx="100" cy="139" rx="9" ry="2.7" fill="#103b4d"/>
    <ellipse cx="100" cy="139" rx="5" ry="1.5" fill="#0b2c3a"/>

    <!-- narrow cylinder -->
    <rect x="90" y="105" width="20" height="25" fill="url(#sat-body2)"/>
    <ellipse cx="100" cy="105" rx="10" ry="3" fill="#e2f4fc" stroke="#5aa6c2" stroke-width="0.6"/>
    <g stroke="rgba(40,110,135,0.4)" stroke-width="0.6">
      <line x1="95" y1="105.5" x2="95" y2="130"/>
      <line x1="105" y1="105.5" x2="105" y2="130"/>
    </g>

    <!-- shoulder taper -->
    <polygon points="84,100 116,100 110,105 90,105" fill="url(#sat-body)"/>

    <!-- wide main cylinder -->
    <rect x="84" y="70" width="32" height="30" fill="url(#sat-body)"/>
    <ellipse cx="100" cy="70" rx="16" ry="4.6" fill="#d6eefb" stroke="#5aa6c2" stroke-width="0.6"/>
    <g stroke="rgba(36,100,124,0.36)" stroke-width="0.6">
      <line x1="92" y1="71" x2="92" y2="100"/>
      <line x1="100" y1="72" x2="100" y2="100"/>
      <line x1="108" y1="71" x2="108" y2="100"/>
    </g>
    <rect x="87" y="71" width="3.5" height="28" rx="1.5" fill="rgba(226,247,253,0.5)"/>

    <!-- accent band -->
    <rect x="86" y="66" width="28" height="4" fill="#1f6f8c"/>
    <ellipse cx="100" cy="66" rx="14" ry="4" fill="#2a86a3"/>

    <!-- dome taper -->
    <polygon points="88,66 112,66 105,56 95,56" fill="url(#sat-body2)"/>
    <ellipse cx="100" cy="56" rx="5" ry="1.7" fill="#e2f4fc" stroke="#5aa6c2" stroke-width="0.5"/>

    <!-- top nub -->
    <rect x="96" y="50" width="8" height="6" rx="1" fill="url(#sat-body2)"/>
    <ellipse cx="100" cy="50" rx="4" ry="1.4" fill="#e2f4fc" stroke="#5aa6c2" stroke-width="0.5"/>

  </g>
</svg>
