<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="rotate(35 100 100)">

    <!-- ── Booms ── -->
    <rect x="60" y="98" width="22" height="4" rx="1" fill="#3f9bba"/>
    <rect x="118" y="98" width="22" height="4" rx="1" fill="#3f9bba"/>

    <!-- ── LEFT solar panel (3×2 grid) ── -->
    <rect x="16" y="83" width="46" height="34" rx="1.5" fill="#5fbdde" stroke="#23647d" stroke-width="2"/>
    <g stroke="#23647d" stroke-width="1.6">
      <line x1="31.3" y1="83" x2="31.3" y2="117"/>
      <line x1="46.7" y1="83" x2="46.7" y2="117"/>
      <line x1="16" y1="100" x2="62" y2="100"/>
    </g>

    <!-- ── RIGHT solar panel (3×2 grid) ── -->
    <rect x="138" y="83" width="46" height="34" rx="1.5" fill="#5fbdde" stroke="#23647d" stroke-width="2"/>
    <g stroke="#23647d" stroke-width="1.6">
      <line x1="153.3" y1="83" x2="153.3" y2="117"/>
      <line x1="168.7" y1="83" x2="168.7" y2="117"/>
      <line x1="138" y1="100" x2="184" y2="100"/>
    </g>

    <!-- ── Dish antenna (front) ── -->
    <rect x="98.5" y="120" width="3" height="13" fill="#3f9bba"/>
    <ellipse cx="100" cy="141" rx="13" ry="7.5" fill="#5fbdde" stroke="#23647d" stroke-width="1.5"/>
    <ellipse cx="100" cy="140" rx="7.5" ry="4.2" fill="#2a7187"/>
    <circle cx="100" cy="140" r="1.6" fill="#5fbdde"/>

    <!-- ── Central body (rounded module) ── -->
    <path d="M100,74
             C112,74 121,84 121,98
             C121,114 113,127 100,127
             C87,127 79,114 79,98
             C79,84 88,74 100,74 Z"
          fill="#5fbdde" stroke="#23647d" stroke-width="1.5"/>
    <!-- subtle hull seam -->
    <path d="M82,104 C90,109 110,109 118,104" fill="none" stroke="#2f81a0" stroke-width="1.4"/>
    <!-- antenna nubs / thrusters on top -->
    <circle cx="91" cy="76" r="4.5" fill="#5fbdde" stroke="#23647d" stroke-width="1.3"/>
    <circle cx="101" cy="71" r="5.5" fill="#5fbdde" stroke="#23647d" stroke-width="1.3"/>
    <circle cx="111" cy="77" r="4" fill="#5fbdde" stroke="#23647d" stroke-width="1.3"/>
    <line x1="101" y1="66" x2="101" y2="58" stroke="#5fbdde" stroke-width="2"/>
    <circle cx="101" cy="56" r="2.2" fill="#5fbdde"/>

  </g>
</svg>
