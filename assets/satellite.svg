<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sat-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef6fa"/>
      <stop offset="0.30" stop-color="#cde1ea"/>
      <stop offset="0.62" stop-color="#9bbecd"/>
      <stop offset="1" stop-color="#5f8597"/>
    </linearGradient>
    <linearGradient id="sat-body2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f9fb"/>
      <stop offset="0.35" stop-color="#d8e8ef"/>
      <stop offset="0.65" stop-color="#aacad7"/>
      <stop offset="1" stop-color="#6f93a4"/>
    </linearGradient>
    <linearGradient id="sat-panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ba0b0"/>
      <stop offset="1" stop-color="#2f7384"/>
    </linearGradient>
    <radialGradient id="sat-dish" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#eef5f8"/>
      <stop offset="0.7" stop-color="#9fbcc8"/>
      <stop offset="1" stop-color="#5d7d8c"/>
    </radialGradient>
  </defs>

  <g transform="rotate(45 100 100)">

    <!-- ══ SOLAR WINGS (drawn horizontal; rotate makes them the diagonal cross) ══ -->
    <!-- struts -->
    <line x1="70" y1="92" x2="83" y2="92" stroke="#6f93a4" stroke-width="2"/>
    <line x1="117" y1="92" x2="130" y2="92" stroke="#6f93a4" stroke-width="2"/>
    <!-- LEFT wing (3 panels) -->
    <g stroke="#235c6b" stroke-width="1">
      <polygon points="20,74 70,82 70,104 20,96" fill="url(#sat-panel)"/>
      <g stroke="rgba(20,55,64,0.6)" stroke-width="0.8">
        <line x1="36.7" y1="76.7" x2="36.7" y2="98.7"/>
        <line x1="53.3" y1="79.3" x2="53.3" y2="101.3"/>
        <line x1="20" y1="85" x2="70" y2="93"/>
      </g>
    </g>
    <!-- RIGHT wing (3 panels) -->
    <g stroke="#1f5260" stroke-width="1">
      <polygon points="130,82 180,74 180,96 130,104" fill="url(#sat-panel)"/>
      <g stroke="rgba(20,55,64,0.55)" stroke-width="0.8">
        <line x1="146.7" y1="79.3" x2="146.7" y2="101.3"/>
        <line x1="163.3" y1="76.7" x2="163.3" y2="98.7"/>
        <line x1="130" y1="93" x2="180" y2="85"/>
      </g>
    </g>

    <!-- ══ BODY (vertical cylinder; top = back/dome, bottom = front/dish) ══ -->
    <!-- dish strut -->
    <line x1="100" y1="139" x2="100" y2="150" stroke="#8aa6b3" stroke-width="2"/>
    <!-- dish -->
    <g>
      <ellipse cx="100" cy="157" rx="15" ry="6" fill="url(#sat-dish)" stroke="#536f7d" stroke-width="1"/>
      <ellipse cx="100" cy="156" rx="9.5" ry="3.6" fill="rgba(60,84,96,0.45)"/>
      <line x1="92" y1="152" x2="100" y2="148" stroke="#7c98a5" stroke-width="0.9"/>
      <line x1="108" y1="152" x2="100" y2="148" stroke="#7c98a5" stroke-width="0.9"/>
      <circle cx="100" cy="147.5" r="1.5" fill="#dCEAF0"/>
    </g>

    <!-- aperture / instrument ring (front) -->
    <rect x="91" y="129" width="18" height="10" fill="#27444e"/>
    <ellipse cx="100" cy="129" rx="9" ry="2.8" fill="#3a5d68"/>
    <ellipse cx="100" cy="139" rx="9" ry="2.8" fill="#1c343c"/>
    <ellipse cx="100" cy="139" rx="5" ry="1.6" fill="#0e1f25"/>

    <!-- narrow cylinder -->
    <rect x="89" y="101" width="22" height="29" fill="url(#sat-body2)"/>
    <ellipse cx="100" cy="101" rx="11" ry="3.4" fill="#e3eef3" stroke="#86a7b4" stroke-width="0.6"/>
    <g stroke="rgba(110,147,164,0.4)" stroke-width="0.6">
      <line x1="95" y1="101.5" x2="95" y2="130"/>
      <line x1="105" y1="101.5" x2="105" y2="130"/>
    </g>

    <!-- shoulder taper -->
    <polygon points="83,96 117,96 111,101 89,101" fill="url(#sat-body)"/>

    <!-- wide main cylinder -->
    <rect x="83" y="64" width="34" height="32" fill="url(#sat-body)"/>
    <ellipse cx="100" cy="64" rx="17" ry="5" fill="#eef6fa" stroke="#86a7b4" stroke-width="0.6"/>
    <g stroke="rgba(95,133,151,0.38)" stroke-width="0.6">
      <line x1="91" y1="65" x2="91" y2="96"/>
      <line x1="100" y1="66" x2="100" y2="96"/>
      <line x1="109" y1="65" x2="109" y2="96"/>
    </g>
    <!-- specular highlight -->
    <rect x="86" y="65" width="4" height="30" rx="2" fill="rgba(255,255,255,0.4)"/>

    <!-- teal accent band -->
    <rect x="85" y="60" width="30" height="5" fill="#2f7180"/>
    <ellipse cx="100" cy="60" rx="15" ry="4.4" fill="#3a8492"/>

    <!-- dome taper -->
    <polygon points="89,60 111,60 105,50 95,50" fill="url(#sat-body2)"/>
    <ellipse cx="100" cy="50" rx="6" ry="2" fill="#e8f2f6" stroke="#86a7b4" stroke-width="0.5"/>

    <!-- top nub -->
    <rect x="96" y="44" width="8" height="6" rx="1" fill="url(#sat-body2)"/>
    <ellipse cx="100" cy="44" rx="4" ry="1.5" fill="#eef6fa" stroke="#86a7b4" stroke-width="0.5"/>

  </g>
</svg>
