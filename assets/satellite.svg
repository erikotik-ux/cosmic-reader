<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="rotate(35 100 100)">

    <!-- ── Booms ── -->
    <rect x="60" y="98" width="22" height="4" rx="1" fill="#3f9bba"/>
    <rect x="118" y="98" width="22" height="4" rx="1" fill="#3f9bba"/>

    <!-- ── LEFT solar panel (3×2 grid) ── -->
    <rect x="16" y="83" width="46" height="34" rx="1.5" fill="#5fbdde" stroke="#000" stroke-width="2"/>
    <g stroke="#000" stroke-width="1.6">
      <line x1="31.3" y1="83" x2="31.3" y2="117"/>
      <line x1="46.7" y1="83" x2="46.7" y2="117"/>
      <line x1="16" y1="100" x2="62" y2="100"/>
    </g>

    <!-- ── RIGHT solar panel (3×2 grid) ── -->
    <rect x="138" y="83" width="46" height="34" rx="1.5" fill="#5fbdde" stroke="#000" stroke-width="2"/>
    <g stroke="#000" stroke-width="1.6">
      <line x1="153.3" y1="83" x2="153.3" y2="117"/>
      <line x1="168.7" y1="83" x2="168.7" y2="117"/>
      <line x1="138" y1="100" x2="184" y2="100"/>
    </g>

    <!-- ── Dish antenna (front): parabolic bowl + tripod feed ── -->
    <rect x="98.5" y="121" width="3" height="11" fill="#3f9bba"/>
    <!-- bowl rim -->
    <ellipse cx="100" cy="139" rx="13" ry="8" fill="#5fbdde" stroke="#000" stroke-width="1.5"/>
    <!-- concave interior (reads as depth against the dark bg) -->
    <ellipse cx="100" cy="137.4" rx="9.6" ry="5.4" fill="#000"/>
    <!-- tripod feed struts converging to the focal point -->
    <g stroke="#5fbdde" stroke-width="1.5" stroke-linecap="round">
      <line x1="91" y1="140" x2="100" y2="155"/>
      <line x1="109" y1="140" x2="100" y2="155"/>
      <line x1="100" y1="134" x2="100" y2="155"/>
    </g>
    <!-- feed horn -->
    <circle cx="100" cy="155.5" r="2.3" fill="#5fbdde" stroke="#000" stroke-width="0.8"/>

    <!-- ── Central body (rounded module) ── -->
    <path d="M100,74
             C112,74 121,84 121,98
             C121,114 113,127 100,127
             C87,127 79,114 79,98
             C79,84 88,74 100,74 Z"
          fill="#5fbdde" stroke="#000" stroke-width="1.5"/>
    <!-- hull seam -->
    <path d="M82,104 C90,109 110,109 118,104" fill="none" stroke="#000" stroke-width="1.4"/>
    <!-- antenna nubs / thrusters on top -->
    <circle cx="91" cy="76" r="4.5" fill="#5fbdde" stroke="#000" stroke-width="1.3"/>
    <circle cx="101" cy="71" r="5.5" fill="#5fbdde" stroke="#000" stroke-width="1.3"/>
    <circle cx="111" cy="77" r="4" fill="#5fbdde" stroke="#000" stroke-width="1.3"/>
    <line x1="101" y1="66" x2="101" y2="58" stroke="#5fbdde" stroke-width="2"/>
    <circle cx="101" cy="56" r="2.2" fill="#5fbdde"/>

  </g>
</svg>
