<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 92" width="160" height="92">
  <defs>
    <linearGradient id="sat-tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(150,210,240,0.26)"/>
      <stop offset="0.5" stop-color="rgba(95,170,215,0.16)"/>
      <stop offset="1" stop-color="rgba(60,120,165,0.20)"/>
    </linearGradient>
    <linearGradient id="sat-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(130,195,232,0.22)"/>
      <stop offset="1" stop-color="rgba(70,135,180,0.14)"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#a8dcf2" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">

    <!-- ── Booms ── -->
    <line x1="52" y1="44" x2="58" y2="44" stroke="#7fb6d4" stroke-width="1.4"/>
    <line x1="104" y1="44" x2="110" y2="44" stroke="#7fb6d4" stroke-width="1.4"/>

    <!-- ── LEFT solar wing ── -->
    <polygon points="52,30 12,24 12,52 52,58" fill="url(#sat-wing)" stroke="#8fc8e6"/>
    <g stroke="rgba(150,205,235,0.5)" stroke-width="0.6">
      <line x1="42" y1="28.5" x2="42" y2="56.5"/>
      <line x1="32" y1="27" x2="32" y2="55"/>
      <line x1="22" y1="25.5" x2="22" y2="53.5"/>
      <line x1="52" y1="44" x2="12" y2="38"/>
    </g>

    <!-- ── RIGHT solar wing ── -->
    <polygon points="110,30 150,36 150,64 110,58" fill="url(#sat-wing)" stroke="#6fa9cd"/>
    <g stroke="rgba(120,175,210,0.45)" stroke-width="0.6">
      <line x1="120" y1="31.5" x2="120" y2="59.5"/>
      <line x1="130" y1="33" x2="130" y2="61"/>
      <line x1="140" y1="34.5" x2="140" y2="62.5"/>
      <line x1="110" y1="44" x2="150" y2="50"/>
    </g>

    <!-- ── CYLINDER BODY (tube) ── -->
    <path d="M58,28 L104,28 A6,16 0 0 1 104,60 L58,60 A6,16 0 0 1 58,28 Z" fill="url(#sat-tube)"/>
    <!-- back rim of the tube (left) -->
    <ellipse cx="58" cy="44" rx="6" ry="16" stroke="rgba(150,205,235,0.4)"/>
    <!-- segment bands -->
    <ellipse cx="74" cy="44" rx="6" ry="16" stroke="rgba(150,205,235,0.55)"/>
    <ellipse cx="88" cy="44" rx="6" ry="16" stroke="rgba(150,205,235,0.55)"/>
    <ellipse cx="97" cy="44" rx="6" ry="16" stroke="rgba(170,215,240,0.7)"/>
    <!-- small sensor box on the hull -->
    <rect x="64" y="33" width="9" height="5" rx="1" stroke="rgba(180,222,242,0.7)"/>

    <!-- ── THRUSTER / engine ring (right end cap) ── -->
    <ellipse cx="104" cy="44" rx="6" ry="16" stroke="#bfe4f6"/>
    <ellipse cx="104" cy="44" rx="3" ry="8.5" stroke="rgba(190,228,246,0.85)"/>
    <ellipse cx="104" cy="44" rx="1.4" ry="4" stroke="rgba(190,228,246,0.7)"/>

    <!-- ── PARABOLIC DISH (top-front) with tripod feed ── -->
    <line x1="66" y1="29" x2="62" y2="18"/>
    <g transform="rotate(-22 60 14)">
      <ellipse cx="60" cy="14" rx="11" ry="6" fill="rgba(150,210,238,0.18)" stroke="#bfe4f6"/>
      <ellipse cx="60" cy="14" rx="6.5" ry="3.4" stroke="rgba(150,205,235,0.6)"/>
    </g>
    <line x1="52" y1="11" x2="60" y2="3"/>
    <line x1="68" y1="13" x2="60" y2="3"/>
    <circle cx="60" cy="2.6" r="1.4" fill="rgba(214,230,240,0.9)" stroke="none"/>

    <!-- whip antenna -->
    <line x1="100" y1="28" x2="106" y2="17" stroke="rgba(170,215,240,0.7)" stroke-width="0.8"/>
  </g>
</svg>
