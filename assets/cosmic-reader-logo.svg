<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Glow filter -->
    <filter id="logo-glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Planet body gradient -->
    <radialGradient id="logo-grad" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#003a40"/>
      <stop offset="60%"  stop-color="#001a2a"/>
      <stop offset="100%" stop-color="#000810"/>
    </radialGradient>
  </defs>

  <!-- Outer orbit ring -->
  <ellipse
    cx="18" cy="18"
    rx="16" ry="6"
    stroke="#00f0ff"
    stroke-width="1"
    stroke-opacity="0.35"
    fill="none"
    transform="rotate(-30 18 18)"/>

  <!-- Planet body -->
  <circle cx="18" cy="18" r="9" fill="url(#logo-grad)"/>

  <!-- Planet rim glow -->
  <circle
    cx="18" cy="18" r="9"
    stroke="#00f0ff"
    stroke-width="1"
    stroke-opacity="0.6"
    fill="none"
    filter="url(#logo-glow)"/>

  <!-- CR letterform — C arc -->
  <path
    d="M17 14.5 A4 4 0 0 0 17 21.5"
    stroke="#00f0ff"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"/>

  <!-- CR letterform — R spine -->
  <line
    x1="19" y1="14.2"
    x2="19" y2="21.8"
    stroke="#00f0ff"
    stroke-width="1.4"
    stroke-linecap="round"/>

  <!-- CR letterform — R bowl -->
  <path
    d="M19 14.2 Q22.5 14.2 22.5 17 Q22.5 18.8 19 18.8"
    stroke="#00f0ff"
    stroke-width="1.4"
    stroke-linecap="round"
    fill="none"/>

  <!-- CR letterform — R leg -->
  <line
    x1="19.5" y1="18.8"
    x2="22.8" y2="21.8"
    stroke="#00f0ff"
    stroke-width="1.4"
    stroke-linecap="round"/>

  <!-- Orbit dot -->
  <circle
    cx="32" cy="10" r="1.5"
    fill="#00f0ff"
    opacity="0.9"
    filter="url(#logo-glow)"/>

</svg>
